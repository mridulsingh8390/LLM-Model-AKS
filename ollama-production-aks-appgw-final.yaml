# =============================================================================
# Ollama on AKS + Azure Application Gateway (AGIC)
# Production-oriented baseline
# REQUIRED CUSTOMIZATION:
# 1. Change OLLAMA_IMAGE to a version you have tested.
# 2. Change the hostname in the Ingress.
# 3. Verify your GPU node label: accelerator=nvidia.
# 4. Verify storageClassName: managed-csi-premium exists.
# 5. Create the htpasswd Secret separately (commands in deploy script).
# IMPORTANT:
# - This manifest intentionally does NOT use an AGIC basic-auth annotation.
# - Authentication is handled by the NGINX sidecar.
# - NetworkPolicy is intentionally omitted because AGIC backend traffic
#   originates from Application Gateway infrastructure and a Kubernetes
#   namespace/pod selector can incorrectly block it.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
  labels:
    app.kubernetes.io/name: ollama
    pod-security.kubernetes.io/enforce: baseline
---
# =============================================================================
# Persistent model storage
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: ollama
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi-premium
  resources:
    requests:
      storage: 500Gi
---
# =============================================================================
# NGINX reverse proxy + authentication configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-nginx-config
  namespace: ollama
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        auth_basic "Ollama LLM API";
        auth_basic_user_file /etc/nginx/secrets/auth;
        
        # Unauthenticated health endpoint used by Kubernetes and AGIC.
        location = /health {
            auth_basic off;
            proxy_pass http://127.0.0.1:11434/api/tags;
            proxy_set_header Host $host;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }
        
        location / {
            proxy_pass http://127.0.0.1:11434;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # LLM generation can take a long time.
            proxy_connect_timeout 60s;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            
            # Required for Ollama streaming responses.
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Allow larger RAG/context payloads.
            client_max_body_size 50m;
        }
    }
---
# =============================================================================
# Ollama Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
    app.kubernetes.io/name: ollama
    app.kubernetes.io/component: inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
        app.kubernetes.io/name: ollama
        app.kubernetes.io/component: inference
    spec:
      terminationGracePeriodSeconds: 60
      nodeSelector:
        accelerator: nvidia
      tolerations:
        - key: sku
          operator: Equal
          value: gpu
          effect: NoSchedule
      securityContext:
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        # ---------------------------------------------------------------------
        # Ollama
        # ---------------------------------------------------------------------
        - name: ollama
          image: ollama/ollama:0.5.7
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: ollama
              containerPort: 11434
              protocol: TCP
          env:
            - name: OLLAMA_HOST
              value: "127.0.0.1:11434"
            - name: OLLAMA_MODELS
              value: "/root/.ollama/models"
            - name: OLLAMA_NUM_PARALLEL
              value: "2"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_KEEP_ALIVE
              value: "15m"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
            limits:
              cpu: "12"
              memory: "48Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /api/tags
              port: 11434
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
        # ---------------------------------------------------------------------
        # NGINX unprivileged authentication/reverse proxy
        # ---------------------------------------------------------------------
        - name: nginx-auth
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: auth-secret
              mountPath: /etc/nginx/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-models
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: nginx-config
          configMap:
            name: ollama-nginx-config
        - name: auth-secret
          secret:
            secretName: ollama-basic-auth
            defaultMode: 0444
---
# =============================================================================
# Internal service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: ollama
  labels:
    app: ollama
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
# =============================================================================
# Azure Application Gateway / AGIC
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ollama-ingress
  namespace: ollama
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/request-timeout: "1800"
    appgw.ingress.kubernetes.io/backend-protocol: "http"
    appgw.ingress.kubernetes.io/health-probe-path: "/health"
    appgw.ingress.kubernetes.io/health-probe-port: "8080"
    appgw.ingress.kubernetes.io/health-probe-status-codes: "200-399"
    appgw.ingress.kubernetes.io/health-probe-interval: "30"
    appgw.ingress.kubernetes.io/health-probe-timeout: "30"
    appgw.ingress.kubernetes.io/health-probe-unhealthy-threshold: "3"
    appgw.ingress.kubernetes.io/connection-draining: "true"
    appgw.ingress.kubernetes.io/connection-draining-timeout: "60"
spec:
  ingressClassName: azure/application-gateway
  rules:
    - host: ollama.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ollama-service
                port:
                  number: 80