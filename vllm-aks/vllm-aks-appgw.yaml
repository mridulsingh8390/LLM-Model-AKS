# vLLM on AKS behind Application Gateway (AGIC).
# Rendered by deploy-vllm-aks.sh with:
#   envsubst '${VLLM_HOST} ${MODEL_NAME} ${VLLM_IMAGE} ${GPU_POOL_NAME} ${DTYPE} ${MAX_MODEL_LEN}'
# Kubernetes-style $(VAR) references below are NOT touched by envsubst.
apiVersion: v1
kind: Namespace
metadata:
  name: vllm
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-model-cache
  namespace: vllm
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: managed-csi-premium
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: vllm
  labels:
    app: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO disk + 1 GPU: old pod must release both first
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      nodeSelector:
        kubernetes.azure.com/agentpool: ${GPU_POOL_NAME}
      tolerations:
        - key: sku
          operator: Equal
          value: gpu
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          image: ${VLLM_IMAGE}
          command: ["vllm", "serve"]
          args:
            - "$(MODEL_NAME)"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--api-key=$(VLLM_API_KEY)"
            - "--dtype=$(DTYPE)"
            - "--max-model-len=$(MAX_MODEL_LEN)"
            - "--gpu-memory-utilization=0.90"
          env:
            - name: MODEL_NAME
              value: "${MODEL_NAME}"
            - name: DTYPE
              value: "${DTYPE}"
            - name: MAX_MODEL_LEN
              value: "${MAX_MODEL_LEN}"
            - name: HF_HOME
              value: /models
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: api-key
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "4"
              memory: 24Gi
              nvidia.com/gpu: 1
            limits:
              memory: 32Gi
              nvidia.com/gpu: 1
          # /health is not protected by --api-key, so probes and AppGW work unauthenticated.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 90      # up to 15 min for model download + load
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - { name: model-cache, mountPath: /models }
            - { name: shm,         mountPath: /dev/shm }
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: vllm
  labels:
    app: vllm
spec:
  type: ClusterIP
  selector:
    app: vllm
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vllm-ingress
  namespace: vllm
  annotations:
    appgw.ingress.kubernetes.io/backend-protocol: "http"
    appgw.ingress.kubernetes.io/health-probe-path: "/health"
    appgw.ingress.kubernetes.io/request-timeout: "300"
    appgw.ingress.kubernetes.io/connection-draining: "true"
    appgw.ingress.kubernetes.io/connection-draining-timeout: "30"
    # For HTTPS, create a TLS secret (or use a Key Vault cert on the gateway), then uncomment:
    # appgw.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: azure-application-gateway
  # tls:
  #   - hosts: ["${VLLM_HOST}"]
  #     secretName: vllm-tls
  rules:
    - host: ${VLLM_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vllm-service
                port:
                  number: 80
