# 10 extra models, ready to paste into models.conf (AKS / vLLM, GPU).
# Format:  key | Hugging Face model id | max-model-len | gated (yes/no) | approx GPU memory (fp16) | notes
# These are the original Hugging Face model ids (the same models whose GGUF versions are in the kind package).
# Use:  copy the lines you want into models.conf, then  MODEL=<key> bash deploy-vllm-aks.sh
#       Gated models need HF_TOKEN and an accepted license on huggingface.co.
# Memory figures are rough fp16 weight sizes; the KV cache needs more, so lower MAX_MODEL_LEN if it does not fit.
# On a 16 GB T4 use DTYPE=half and stay at or below ~4 GB models. Qwen3 and Gemma 3 prefer bf16 (A10 or newer).
qwen2.5-coder-0.5b|Qwen/Qwen2.5-Coder-0.5B-Instruct|8192|no|~1 GB|tiny code model
qwen2.5-coder-1.5b|Qwen/Qwen2.5-Coder-1.5B-Instruct|8192|no|~3 GB|code model for Terraform/YAML/scripts
qwen2.5-coder-3b|Qwen/Qwen2.5-Coder-3B-Instruct|8192|no|~7 GB|better code quality; qwen-research license (non-commercial)
qwen2.5-3b|Qwen/Qwen2.5-3B-Instruct|8192|no|~7 GB|general chat; qwen-research license (non-commercial)
qwen3-0.6b|Qwen/Qwen3-0.6B|8192|no|~1.5 GB|Qwen3 family, Apache-2.0; prints its reasoning in think tags
qwen3-1.7b|Qwen/Qwen3-1.7B|8192|no|~4 GB|Qwen3 family, Apache-2.0; prints its reasoning in think tags
qwen3-4b|Qwen/Qwen3-4B|8192|no|~8 GB|strongest small Qwen3; fits a 16 GB T4 with a short context
deepseek-r1-1.5b|deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B|8192|no|~4 GB|reasoning model; writes long think blocks
gemma-3-1b|google/gemma-3-1b-it|8192|yes|~2.5 GB|gated: accept the Gemma license; bf16 recommended (not for T4)
qwen2.5-coder-7b|Qwen/Qwen2.5-Coder-7B-Instruct|8192|no|~16 GB|best code model here; needs an A10 (24 GB) or larger
