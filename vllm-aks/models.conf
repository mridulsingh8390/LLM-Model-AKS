# Small-model catalog for AKS (vLLM, GPU).
# key | HF model id | default max-model-len | gated on HF (needs HF_TOKEN + accepted license) | approx GPU memory (fp16) | notes
# Pick one with:  MODEL=<key> bash deploy-vllm-aks.sh      List with:  bash deploy-vllm-aks.sh models
# Any other Hugging Face model: MODEL_NAME=<org/model> MAX_MODEL_LEN=<n> bash deploy-vllm-aks.sh
qwen2.5-0.5b|Qwen/Qwen2.5-0.5B-Instruct|8192|no|~1 GB|smallest; fits any GPU
qwen2.5-1.5b|Qwen/Qwen2.5-1.5B-Instruct|8192|no|~3 GB|good quality for its size
smollm2-1.7b|HuggingFaceTB/SmolLM2-1.7B-Instruct|8192|no|~4 GB|Apache-2.0
tinyllama-1.1b|TinyLlama/TinyLlama-1.1B-Chat-v1.0|2048|no|~2.5 GB|tiny Llama-architecture chat model; 2k context
phi-3.5-mini|microsoft/Phi-3.5-mini-instruct|4096|no|~8 GB|3.8B, MIT license
llama-3.2-1b|meta-llama/Llama-3.2-1B-Instruct|8192|yes|~2.5 GB|gated: accept the Meta license on Hugging Face
llama-3.2-3b|meta-llama/Llama-3.2-3B-Instruct|8192|yes|~7 GB|gated: accept the Meta license on Hugging Face
llama-3.1-8b|meta-llama/Llama-3.1-8B-Instruct|8192|yes|~16 GB|default; needs A10 24 GB or larger (too tight for a 16 GB T4)
